name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate tag and extract release notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TARGET_TAG="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TARGET_TAG" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Tag $TARGET_TAG does not exist in repository." >&2
            exit 1
          fi
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          node scripts/extract-release-notes.mjs "$TARGET_TAG" --verify-package-version --out /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release edit "$TARGET_TAG" \
              --title "Gemini Resets $TARGET_TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TARGET_TAG" \
              --verify-tag \
              --title "Gemini Resets $TARGET_TAG" \
              --notes-file /tmp/release-notes.md
          fi
